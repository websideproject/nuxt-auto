# GitHub's "Generate release notes" button. Releases are drafted by Release Drafter (.github/release-drafter.yml);
# these sections mirror it so both group a PR the same way.
changelog:
  categories:
    - title: 💥 Breaking Changes
      labels:
        - breaking
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: ⚡ Performance
      labels:
        - performance
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 🧰 Maintenance
      labels:
        - refactor
        - test
        - build
        - ci
        - chore
        - revert
    - title: Other Changes
      labels:
        - '*'
