# GitHub's "Generate release notes" button. Releases are drafted by Release Drafter (.github/release-drafter.yml);
# these are the same sections, but GitHub puts each PR only in the FIRST section it matches.
changelog:
  categories:
    - title: 💥 Breaking Changes
      labels:
        - breaking
    - title: 📦 nuxt-auto-api
      labels:
        - 'area: api'
    - title: 🎨 nuxt-auto-admin
      labels:
        - 'area: admin'
    - title: 🧪 Playground
      labels:
        - 'area: playground'
    - title: 📚 Documentation
      labels:
        - 'area: docs'
    - title: Other Changes
      labels:
        - '*'
