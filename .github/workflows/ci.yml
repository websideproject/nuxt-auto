name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare
        run: bun run dev:prepare
      - name: Build modules
        run: bun run build
      # The e2e fixtures normally load src/; run them once against the BUILT module — what users install.
      - name: E2E against the built API module
        working-directory: packages/nuxt-auto-api
        run: AUTO_API_DIST=1 bunx vitest run test/basic.test.ts test/security.test.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare
        run: bun run dev:prepare
      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare
        run: bun run dev:prepare
      - name: Typecheck
        run: bun run typecheck

  # The engine conformance suite (packages/nuxt-auto-api/test/engines) runs every request against real databases:
  # SQLite, libsql and D1 (Miniflare) in-process, Postgres and MySQL as services, and PlanetScale through
  # ps-http-sim — the PlanetScale HTTP API in front of that MySQL.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autoapi
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: autoapi
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -ptest" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      AUTOAPI_TEST_PG_URL: postgres://postgres:test@127.0.0.1:5432/autoapi
      AUTOAPI_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/autoapi
      AUTOAPI_TEST_PLANETSCALE_URL: http://root:test@127.0.0.1:3900
      AUTOAPI_TEST_REQUIRE_ENGINES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Start the PlanetScale HTTP simulator
        # It opens a MySQL connection per HTTP session, more than MySQL's default 151.
        run: |
          mysql -h127.0.0.1 -uroot -ptest -e 'SET GLOBAL max_connections = 2000'
          docker run -d --network host ghcr.io/mattrobenolt/ps-http-sim:latest -listen-addr=127.0.0.1 -listen-port=3900 -mysql-addr=127.0.0.1 -mysql-port=3306 -mysql-dbname=autoapi -log-level=error
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare
        run: bun run dev:prepare
      - name: Test
        run: bun run test

  # Screenshot suite (apps/playground/test/visual.spec.ts): builds and serves the playground on its seeded database
  # and compares every page with the images in apps/docs/public/screenshots, which the docs show. It runs in the
  # container the images were taken in; fonts render differently anywhere else.
  visual:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-jammy
    steps:
      - uses: actions/checkout@v4
      # setup-bun unpacks bun with unzip, which the Playwright image does not have.
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the playground and its database
        working-directory: apps/playground
        run: bun run build:visual && bun run db:visual
      # Playwright starts the preview itself (webServer in playwright.config.ts).
      - name: Compare screenshots
        working-directory: apps/playground
        run: bun run test:visual
      - name: Upload the expected, actual and diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: apps/playground/test-results
          retention-days: 14

  # Nuxt 5 is not released yet: run the API suite (including the e2e builds in test/*.test.ts) against the
  # nightly so breakage shows up early. Informational — it does not block the pipeline.
  test-nuxt-5:
    name: test (nuxt 5 nightly)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Use the Nuxt 5 nightly
        working-directory: packages/nuxt-auto-api
        # `5x` is a dist-tag; bun reads it as a version range inside an npm: alias, so resolve it with npm first.
        run: |
          V=$(npm view nuxt-nightly@5x version)
          echo "Nuxt 5 nightly: $V"
          bun add -d nuxt@npm:nuxt-nightly@$V @nuxt/kit@npm:@nuxt/kit-nightly@$V @nuxt/schema@npm:@nuxt/schema-nightly@$V
      - name: Prepare
        run: bun run dev:prepare
      - name: Test
        working-directory: packages/nuxt-auto-api
        run: bun run test

  # PR previews: every pull request publishes installable builds of both packages to pkg.pr.new and comments the
  # install commands on the PR. Requires the pkg.pr.new GitHub App on the repo: https://github.com/apps/pkg-pr-new
  # --peerDeps: admin's peer `@websideproject/nuxt-auto-api: workspace:*` is otherwise shipped as-is and the preview
  # cannot be installed; with it the peer is set to the API's version, which the preview API satisfies.
  preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: [build, lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare
        run: bun run dev:prepare
      - name: Build modules
        run: bun run build
      - name: Publish previews
        run: bunx pkg-pr-new publish --compact --no-template --peerDeps './packages/nuxt-auto-api' './packages/nuxt-auto-admin'
