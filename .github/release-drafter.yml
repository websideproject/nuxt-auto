name-template: 'v$RESOLVED_VERSION ✨'
tag-template: 'v$RESOLVED_VERSION'

# Sections come from the TYPE label that .github/workflows/label-pr.yml sets from the PR title. A PR has exactly
# one, so it is listed once. (Area labels are filters, not sections.)
categories:
  - title: '💥 Breaking Changes'
    labels:
      - 'breaking'
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
  - title: '⚡ Performance'
    labels:
      - 'performance'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
  - title: '🧰 Maintenance'
    labels:
      - 'refactor'
      - 'test'
      - 'build'
      - 'ci'
      - 'chore'
      - 'revert'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

# While the packages are 0.x a breaking change is a minor bump (0.0.11 → 0.1.0). At 1.0, move `breaking` to major.
version-resolver:
  minor:
    labels:
      - 'breaking'
      - 'feature'
      - 'enhancement'
  default: patch

template: |
  ## What's Changed

  This release includes updates for both `@websideproject/nuxt-auto-api` and `@websideproject/nuxt-auto-admin`.

  $CHANGES

  **Full Changelog**: https://github.com/websideproject/nuxt-auto/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
