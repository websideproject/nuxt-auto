# Area labels, applied by .github/workflows/label-pr.yml from the paths a PR changes. Filters only: release notes
# are grouped by the type label, so a PR is never listed twice.

'area: api':
  - changed-files:
      - any-glob-to-any-file: packages/nuxt-auto-api/**

'area: admin':
  - changed-files:
      - any-glob-to-any-file: packages/nuxt-auto-admin/**

'area: playground':
  - changed-files:
      - any-glob-to-any-file: apps/playground/**

'area: docs':
  - changed-files:
      - any-glob-to-any-file:
          - apps/docs/**
          - '**/README.md'
